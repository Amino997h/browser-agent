<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Agent - واجهة الويب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .log-container {
            font-family: 'Courier New', Courier, monospace;
            direction: ltr;
            text-align: left;
        }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-600 mb-2">🤖 Browser Agent</h1>
            <p class="text-gray-500">وكيل ذكاء اصطناعي محلي يعمل على المتصفح</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- إعدادات المهمة -->
            <div class="md:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">🎯 إعداد المهمة</h2>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">الهدف (Goal):</label>
                    <textarea id="goal" rows="5" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="مثال: ابحث عن وظائف بايثون في لينكد إن واكتب لي الملخص..."></textarea>
                </div>
                
                <button id="startBtn" onclick="startAgent()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                    🚀 ابدأ المهمة
                </button>
                <button id="stopBtn" onclick="stopAgent()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md mt-2 hidden">
                    🛑 إيقاف
                </button>
                
                <!-- لوحة التفاعل (الأسئلة والخيارات) -->
                <div id="interactionPanel" class="mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg hidden shadow-inner fade-in">
                    <h3 class="text-yellow-800 font-bold mb-2 flex items-center">
                        <span class="mr-2">💬</span> سؤال من الوكيل:
                    </h3>
                    <p id="questionText" class="text-gray-700 mb-4 text-sm font-medium"></p>
                    
                    <div id="inputArea" class="mb-4"></div>
                    
                    <button id="submitAnswerBtn" onclick="submitUserAnswer()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow-sm hidden">
                        إرسال الإجابة
                    </button>
                </div>
                
            </div>

            <!-- شاشة المراقبة -->
            <div class="md:col-span-2 bg-gray-900 rounded-xl shadow-lg overflow-hidden flex flex-col h-[600px]">
                <div class="bg-gray-800 px-4 py-3 flex justify-between items-center border-b border-gray-700">
                    <div class="flex space-x-2 rtl:space-x-reverse">
                        <div class="w-3 h-3 rounded-full bg-red-500"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    </div>
                    <div class="flex items-center space-x-3 rtl:space-x-reverse">
                        <button onclick="copyLogs()" class="text-xs font-bold bg-gray-700 hover:bg-gray-600 text-gray-200 py-1 px-3 rounded shadow transition duration-200">📋 نسخ السجل</button>
                        <span id="statusBadge" class="px-2 py-1 text-xs font-bold rounded bg-gray-600 text-white">IDLE</span>
                    </div>
                </div>
                
                <div id="logs" class="p-4 overflow-y-auto flex-1 log-container text-sm text-gray-300 space-y-4">
                    <div class="text-center text-gray-500 mt-10 font-sans" id="placeholder">
                        في انتظار بدء المهمة...<br>سيظهر السجل المباشر هنا.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let selectedOption = "";
        
        const logsDiv = document.getElementById('logs');
        const statusBadge = document.getElementById('statusBadge');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const interactionPanel = document.getElementById('interactionPanel');
        const questionText = document.getElementById('questionText');
        const inputArea = document.getElementById('inputArea');
        const submitAnswerBtn = document.getElementById('submitAnswerBtn');

        function copyLogs() {
            const textToCopy = logsDiv.innerText;
            if (textToCopy.trim() === "") return;
            navigator.clipboard.writeText(textToCopy).then(() => alert("✅ تم النسخ"));
        }

        function appendLog(html) {
            if (document.getElementById("placeholder")) logsDiv.innerHTML = "";
            const div = document.createElement('div');
            div.className = 'fade-in w-full';
            div.innerHTML = html;
            logsDiv.appendChild(div);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function formatLogMessage(msg) {
            const data = JSON.parse(msg);
            
            if (data.type === 'status') {
                statusBadge.textContent = data.status;
                if (data.status === 'RUNNING') {
                    statusBadge.className = "px-2 py-1 text-xs font-bold rounded bg-blue-500 text-white";
                    interactionPanel.classList.add('hidden');
                    stopBtn.classList.remove('hidden');
                } else if (data.status === 'WAITING_USER') {
                    statusBadge.className = "px-2 py-1 text-xs font-bold rounded bg-yellow-500 text-white";
                    statusBadge.textContent = "WAITING INPUT";
                    stopBtn.classList.add('hidden');
                } else if (data.status === 'SUCCESS' || data.status === 'FAILED') {
                    statusBadge.className = "px-2 py-1 text-xs font-bold rounded " + (data.status==='SUCCESS'?"bg-green-500":"bg-red-500") + " text-white";
                    startBtn.classList.remove('hidden');
                    stopBtn.classList.add('hidden');
                    interactionPanel.classList.add('hidden');
                }
                return `<div class="text-blue-400 font-bold border-b border-gray-700 pb-1 mb-2">[Status] ${data.status} | URL: ${data.url}</div>`;
            }
            if (data.type === 'final_result') {
                const color = data.status === 'SUCCESS' ? 'green' : 'red';
                const emoji = data.status === 'SUCCESS' ? '✅' : '❌';
                return `<div class="mt-4 p-4 bg-gray-800 border border-${color}-500 rounded text-white shadow-lg rtl text-right font-sans">
                            <h3 class="font-bold text-lg text-${color}-400 mb-2">${emoji} النتيجة النهائية:</h3>
                            <p class="whitespace-pre-wrap text-md leading-relaxed">${data.message}</p>
                        </div>`;
            }
            if (data.type === 'agent') {
                return `<div class="bg-gray-800 p-3 rounded border-l-4 border-purple-500">
                        <div class="text-purple-400 font-bold mb-1">[Agent]</div>
                        <div class="text-white font-mono bg-black p-2 rounded text-xs whitespace-pre-wrap">${JSON.stringify(data.command, null, 2)}</div>
                    </div>`;
            }
            if (data.type === 'ask_user') {
                showInteractionPanel(data);
                return `<div class="text-yellow-400 mt-2 font-bold bg-gray-800 p-2 rounded">[Agent Question] ${data.question}</div>`;
            }
            if (data.type === 'browser') return `<div class="text-cyan-400 mt-2">[Browser] Scraped ${data.elements} elements.</div>`;
            if (data.type === 'action') return `<div class="text-green-400 mt-2 font-bold">[Action] ${data.result}</div>`;
            return `<div>${msg}</div>`;
        }
        
        function showInteractionPanel(data) {
            questionText.textContent = data.question;
            inputArea.innerHTML = "";
            selectedOption = "";
            
            if (data.input_type === 'options' && data.options && data.options.length > 0) {
                const flexDiv = document.createElement('div');
                flexDiv.className = "flex flex-col space-y-2";
                
                data.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = "text-right w-full bg-white hover:bg-indigo-50 border border-gray-300 rounded px-3 py-2 text-sm transition";
                    btn.textContent = opt;
                    btn.onclick = () => {
                        Array.from(flexDiv.children).forEach(c => {
                            c.classList.remove('border-indigo-500', 'bg-indigo-50', 'ring-1', 'ring-indigo-500');
                        });
                        btn.classList.add('border-indigo-500', 'bg-indigo-50', 'ring-1', 'ring-indigo-500');
                        selectedOption = opt;
                        submitAnswerBtn.classList.remove('hidden');
                    };
                    flexDiv.appendChild(btn);
                });
                inputArea.appendChild(flexDiv);
                submitAnswerBtn.classList.add('hidden');
            } 
            else {
                const input = document.createElement('input');
                input.type = "text";
                input.id = "userTextInput";
                input.className = "w-full px-3 py-2 border rounded focus:ring-2 focus:ring-indigo-500 outline-none";
                input.placeholder = "اكتب إجابتك هنا...";
                input.onkeypress = (e) => { if(e.key === 'Enter') submitUserAnswer(); };
                inputArea.appendChild(input);
                submitAnswerBtn.classList.remove('hidden');
                
                setTimeout(() => input.focus(), 100);
            }
            
            interactionPanel.classList.remove('hidden');
        }

        function submitUserAnswer() {
            if (!ws) return;
            
            let answer = "";
            const textInput = document.getElementById('userTextInput');
            
            if (textInput) {
                answer = textInput.value.trim();
                if (!answer) return alert("الرجاء كتابة إجابة!");
            } else {
                answer = selectedOption;
                if (!answer) return alert("الرجاء اختيار أحد الخيارات!");
            }
            
            ws.send(JSON.stringify({ action: "user_response", answer: answer }));
            appendLog(`<div class="text-white font-bold mt-2 bg-indigo-500 p-2 rounded inline-block">[User] الإجابة: ${answer}</div>`);
            
            interactionPanel.classList.add('hidden');
            stopBtn.classList.remove('hidden');
        }

        function startAgent() {
            const goal = document.getElementById('goal').value;
            if (!goal) return alert("الرجاء إدخال الهدف.");
            
            logsDiv.innerHTML = "";
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            interactionPanel.classList.add('hidden');
            statusBadge.textContent = "INITIALIZING";
            
            ws = new WebSocket("ws://" + window.location.host + "/ws");
            ws.onopen = () => ws.send(JSON.stringify({ goal: goal }));
            ws.onmessage = e => appendLog(formatLogMessage(e.data));
            ws.onclose = () => { startBtn.classList.remove('hidden'); stopBtn.classList.add('hidden'); };
        }

        function stopAgent() {
            if (ws) ws.close();
        }
    </script>
</body>
</html>
